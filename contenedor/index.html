<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Contenedor | En construcción</title>
  <style>
    :root{--bg:#171714;--fg:#f4efe5;--muted:#b8b0a4;--accent:#c58b45;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
    body{display:grid;place-items:center;padding:24px}
    main{max-width:760px;width:100%;text-align:center;padding:64px 28px;border:1px solid rgba(244,239,229,.12);border-radius:28px;background:rgba(255,255,255,.025)}
    .eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
    h1{font-size:clamp(2.2rem,7vw,5rem);line-height:.98;margin:0 0 22px;font-weight:650}
    p{font-size:clamp(1rem,2.7vw,1.3rem);line-height:1.6;color:var(--muted);max-width:560px;margin:0 auto}
    .rule{width:72px;height:2px;background:var(--accent);margin:30px auto}
    small{display:block;color:#8f887d;font-size:.82rem;margin-top:22px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Glamping Ojo de Agua</div>
    <h1>Algo nuevo está tomando forma.</h1>
    <div class="rule"></div>
    <p>Estamos trabajando en un nuevo espacio dentro de Ojo de Agua. Por ahora, esta página permanece en construcción mientras avanzan los interiores, acabados y equipamiento.</p>
    <small>Vista de desarrollo · sin enlace desde el sitio principal</small>
  </main>
</body>
</html>
