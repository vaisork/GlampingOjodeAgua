<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disponibilidad — Glamping Ojo de Agua</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --cream:#F3EEE1;
    --ink:#20331F;
    --brown:#8A6A45;
    --brown-dark:#6E5236;
    --green:#9FCB8E;
    --green-dark:#3D6B34;
    --line:#CFC6AC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia, 'Times New Roman', serif;
    background:#EDE7D8;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  /* =====  CONFIGURA AQUÍ  ===== */
  /* Reemplaza estos dos valores con los tuyos */
  /* ============================= */

  .card{
    background:var(--cream);
    border-radius:16px;
    padding:28px 20px;
    width:100%;
    max-width:480px;
    box-shadow:0 8px 30px rgba(0,0,0,0.12);
    overflow:hidden;
  }
  .hero{
    margin:-28px -20px 18px -20px;
    width:calc(100% + 40px);
    display:block;
  }
  .hero img{
    width:100%;
    height:auto;
    display:block;
  }
  .hero-caption{
    font-family:Georgia, serif;
    font-style:italic;
    color:#fff;
    background:linear-gradient(transparent, rgba(0,0,0,0.55));
    margin-top:-64px;
    padding:34px 16px 10px;
    position:relative;
    font-size:15px;
  }
  .header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .logo{
    width:64px;height:64px;border-radius:50%;
    border:3px solid var(--green-dark);
    overflow:hidden;
    background:#EAF3E3;
  }
  .logo img{width:100%;height:100%;object-fit:cover;}
  h1{
    font-size:26px;
    margin:0;
  }
  .status{
    font-family:Arial, sans-serif;
    font-size:13px;
    color:#5b5540;
    margin-bottom:16px;
    min-height:16px;
  }
  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-family:Arial,sans-serif;
  }
  .nav button{
    background:none;border:1px solid var(--line);
    border-radius:6px;padding:6px 12px;cursor:pointer;
    font-size:14px;color:var(--ink);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:16px;
  }
  .dow{
    font-family:Arial,sans-serif;
    font-weight:700;font-size:12px;
    text-align:center;color:var(--ink);
    background:#E6DFC9;
    border-radius:6px;padding:6px 0;
  }
  .cell{
    aspect-ratio:1/1;
    border-radius:8px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-weight:700;font-size:15px;
    position:relative;
  }
  .cell.empty{background:#EDE9DD;}
  .cell.green{background:var(--green);color:var(--ink);}
  .cell.past{background:var(--brown-dark);color:var(--cream);}
  .cell.occupied{background:var(--brown);color:var(--cream);}
  .dome{width:20px;height:14px;margin-top:2px;}
  .dome svg{width:100%;height:100%;display:block;}
  .selection-help{
    font-family:Arial,sans-serif;
    font-size:13px;
    color:#5b5540;
    margin:-2px 0 12px;
    text-align:center;
  }
  .selection-summary{
    font-family:Arial,sans-serif;
    font-size:13px;
    background:#E6DFC9;
    border-radius:8px;
    padding:10px 12px;
    margin:-4px 0 14px;
    text-align:center;
    min-height:38px;
  }
  .cell.selectable{cursor:pointer;}
  .cell.selected-start,
  .cell.selected-end{
    outline:3px solid var(--ink);
    outline-offset:-3px;
  }
  .cell.in-range{
    box-shadow:inset 0 0 0 3px rgba(32,51,31,.28);
  }
  .legend{
    display:flex;flex-wrap:wrap;gap:14px;
    font-family:Arial,sans-serif;font-size:12px;
    margin-bottom:20px;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .swatch{width:16px;height:16px;border-radius:4px;display:inline-block;}
  .actions{display:flex;flex-direction:column;gap:10px;}
  .actions button{
    padding:12px;border:none;border-radius:8px;
    font-family:Arial,sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;color:#fff;
  }
  #btnWhatsapp{background:#25D366;}
  #btnDescargar{background:var(--brown-dark);}
  .footer{
    text-align:center;font-family:Arial,sans-serif;
    font-size:11px;color:#8a8368;margin-top:14px;
  }
</style>
</head>

<script>
/* ============================================================
   DISPONIBILIDAD — GOOGLE APPS SCRIPT
   La página NO pide iniciar sesión.
   Apps Script devuelve únicamente fechas ocupadas.
   ============================================================ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrNOF7dfsEg0iESuLpKlEibufGk49q-WgXsIEjJwG2hBKFLr9-kS69LGWCBd7JekZxDA/exec";

const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let viewYear, viewMonth;
const today = new Date();
viewYear = today.getFullYear();
viewMonth = today.getMonth();

let ocupadosGlobal = new Set();
let datosCargados = false;
let fechaEntrada = null;
let fechaSalida = null;

function fmt(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}


function parseLocalDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}

function fechaBonita(dateStr){
  if(!dateStr) return '';
  return parseLocalDate(dateStr).toLocaleDateString('es-MX', {
    weekday:'short',
    day:'numeric',
    month:'short',
    year:'numeric'
  });
}

function actualizarResumenSeleccion(){
  const el = document.getElementById('selectionSummary');
  if(!el) return;

  if(!fechaEntrada){
    el.textContent = 'Selecciona tus fechas de estancia.';
    return;
  }

  if(!fechaSalida){
    el.textContent = 'Entrada: ' + fechaBonita(fechaEntrada) + ' · ahora elige la salida.';
    return;
  }

  const noches = Math.round(
    (parseLocalDate(fechaSalida) - parseLocalDate(fechaEntrada)) / 86400000
  );

  el.textContent =
    'Entrada: ' + fechaBonita(fechaEntrada) +
    ' · Salida: ' + fechaBonita(fechaSalida) +
    ' · ' + noches + (noches === 1 ? ' noche' : ' noches');
}

function hayOcupadoEntre(entradaStr, salidaStr){
  let d = parseLocalDate(entradaStr);
  const salida = parseLocalDate(salidaStr);

  // La noche de entrada y las siguientes deben estar libres.
  // El día de salida NO cuenta como noche, por eso puede coincidir
  // con el check-in de otra reserva.
  while(d < salida){
    if(ocupadosGlobal.has(fmt(d))) return true;
    d.setDate(d.getDate()+1);
  }
  return false;
}

function seleccionarFecha(dateStr, isOcupado, isPast){
  if(!datosCargados || isPast) return;

  if(!fechaEntrada || fechaSalida){
    if(isOcupado){
      alert('Esa fecha está ocupada. Elige una fecha disponible para tu entrada.');
      return;
    }

    fechaEntrada = dateStr;
    fechaSalida = null;
    actualizarResumenSeleccion();
    dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
    return;
  }

  const entrada = parseLocalDate(fechaEntrada);
  const candidata = parseLocalDate(dateStr);

  if(candidata <= entrada){
    if(isOcupado){
      alert('Esa fecha está ocupada. Elige una fecha disponible para tu entrada.');
      return;
    }

    fechaEntrada = dateStr;
    fechaSalida = null;
    actualizarResumenSeleccion();
    dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
    return;
  }

  if(hayOcupadoEntre(fechaEntrada, dateStr)){
    alert('Hay una noche ocupada dentro de ese rango. Elige una salida anterior o comienza después de la fecha ocupada.');
    return;
  }

  fechaSalida = dateStr;
  actualizarResumenSeleccion();
  dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
}

function cargarDisponibilidad(){
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Consultando disponibilidad…';

  // JSONP evita problemas CORS entre GitHub Pages y Google Apps Script.
  const callbackName = 'glampingDisponibilidad_' + Date.now();

  const timeout = setTimeout(() => {
    cleanup();
    statusEl.textContent = '⚠️ No se pudo actualizar la disponibilidad. Intenta recargar la página.';
    dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
  }, 15000);

  function cleanup(){
    clearTimeout(timeout);
    try { delete window[callbackName]; } catch(_) { window[callbackName] = undefined; }
    const old = document.getElementById('jsonp-calendar');
    if(old) old.remove();
  }

  window[callbackName] = function(data){
    cleanup();

    if(!data || data.ok !== true || !Array.isArray(data.ocupados)){
      statusEl.textContent = '⚠️ No se pudo leer la disponibilidad.';
      dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
      return;
    }

    ocupadosGlobal = new Set(data.ocupados);
    datosCargados = true;

    const hora = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
    statusEl.textContent = 'Disponibilidad actualizada · ' + hora;
    dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
  };

  const script = document.createElement('script');
  script.id = 'jsonp-calendar';
  script.src = APPS_SCRIPT_URL
    + '?callback=' + encodeURIComponent(callbackName)
    + '&_=' + Date.now();
  script.onerror = function(){
    cleanup();
    statusEl.textContent = '⚠️ Error al consultar la disponibilidad.';
    dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
  };
  document.body.appendChild(script);
}

function dibujarGrid(year, month, ocupados){
  const tituloEl = document.getElementById('titulo');
  tituloEl.textContent = meses[month] + ' ' + year;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay(); // 0=Dom

  for(let i=0;i<firstDay;i++){
    const c = document.createElement('div');
    c.className='cell empty';
    grid.appendChild(c);
  }

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = fmt(new Date(year, month, day, 12, 0, 0));
    const isOcupado = ocupados.has(dateStr);
    const cellDate = new Date(year, month, day);
    const isPast = cellDate < new Date(today.getFullYear(), today.getMonth(), today.getDate());

    const c = document.createElement('div');
    let cls = 'cell ';

    if(isOcupado){ cls += 'occupied'; }
    else if(isPast){ cls += 'past'; }
    else { cls += 'green'; }

    if(datosCargados && !isPast){
      // Un día ocupado puede elegirse únicamente como salida,
      // nunca como entrada.
      if(!isOcupado || (fechaEntrada && !fechaSalida)){
        cls += ' selectable';
      }
    }

    if(dateStr === fechaEntrada) cls += ' selected-start';
    if(dateStr === fechaSalida) cls += ' selected-end';

    if(fechaEntrada && fechaSalida){
      const d = parseLocalDate(dateStr);
      if(d > parseLocalDate(fechaEntrada) && d < parseLocalDate(fechaSalida)){
        cls += ' in-range';
      }
    }

    c.className = cls;
    c.innerHTML = day + (isOcupado
      ? '<div class="dome"><svg viewBox="0 0 60 34" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#F3EEE1" stroke-width="2"><line x1="2" y1="32" x2="58" y2="32"/><path d="M2 32 A28 28 0 0 1 58 32"/><line x1="30" y1="32" x2="30" y2="5"/><line x1="30" y1="32" x2="8" y2="14"/><line x1="30" y1="32" x2="52" y2="14"/><line x1="30" y1="32" x2="14" y2="25"/><line x1="30" y1="32" x2="46" y2="25"/><path d="M8 25 A22 22 0 0 1 52 25"/></svg></div>'
      : '');

    c.addEventListener('click', ()=>{
      seleccionarFecha(dateStr, isOcupado, isPast);
    });

    grid.appendChild(c);
  }

  actualizarResumenSeleccion();
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  viewMonth--;
  if(viewMonth<0){viewMonth=11; viewYear--;}
  dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  viewMonth++;
  if(viewMonth>11){viewMonth=0; viewYear++;}
  dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
});

document.getElementById('btnWhatsapp').addEventListener('click', ()=>{
  if(!fechaEntrada || !fechaSalida){
    alert('Primero selecciona tu fecha de entrada y tu fecha de salida en el calendario.');
    return;
  }

  const noches = Math.round(
    (parseLocalDate(fechaSalida) - parseLocalDate(fechaEntrada)) / 86400000
  );

  const mensaje =
    'Hola, vi la disponibilidad de Glamping Ojo de Agua y quiero solicitar una reserva.\n\n' +
    'Entrada: ' + fechaBonita(fechaEntrada) + '\n' +
    'Salida: ' + fechaBonita(fechaSalida) + '\n' +
    'Estancia: ' + noches + (noches === 1 ? ' noche' : ' noches') + '\n\n' +
    '¿Me pueden confirmar disponibilidad y precio?';

  const texto = encodeURIComponent(mensaje);
  window.open('https://wa.me/527223805677?text=' + texto, '_blank');
});

document.getElementById('btnDescargar').addEventListener('click', ()=>{
  html2canvas(document.getElementById('capture'), {backgroundColor:'#F3EEE1'}).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'disponibilidad-glamping.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

window.addEventListener('load', ()=>{
  dibujarGrid(viewYear, viewMonth, ocupadosGlobal);
  cargarDisponibilidad();
});
</script>
